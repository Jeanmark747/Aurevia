<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eee9d9">
<title>AUREVIA INVESTMENT | Sign Up</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c6a94e;--dark:#191a18;--cream:#eeeadd;--muted:#929087}
body{font-family:Arial,Helvetica,sans-serif;background:#eeeadd;color:#191a18}
button,input{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{width:100%;max-width:520px;min-height:100vh;margin:auto;background:linear-gradient(145deg,#eeeadd,#f8f6ed);padding-bottom:24px}
.language{position:absolute;right:20px;top:20px;border-radius:28px;background:#fff;padding:13px 20px;font-size:13px;font-weight:600}
.brand{text-align:center;padding:83px 20px 23px}
.logo{width:88px;height:88px;border-radius:24px;margin:0 auto 15px;display:grid;place-items:center;color:#171817;font-weight:900;font-size:40px;background:linear-gradient(145deg,#f2dc8b 0%,#bd9838 48%,#352817 100%);border:5px solid #d6d0bd;box-shadow:0 7px 16px #29231426,inset 0 0 0 2px #f5df91}
.brand h2{font-size:25px;font-weight:800;letter-spacing:-.7px}.brand p{font-size:10px;letter-spacing:2px;color:#8b8060;margin-top:6px}
.auth-card{background:#fff;border-radius:25px;border-top:5px solid #c9ad53;margin:0 20px;padding:34px 24px 27px;box-shadow:0 12px 30px #30271410}
.auth-card h1{font-size:32px;letter-spacing:-1.4px;margin-bottom:29px}
.sub{font-size:14px;color:#929087;margin-top:-3px;margin-bottom:28px}.sub a{color:#9d812d;text-decoration:underline;text-underline-offset:3px;font-weight:700;cursor:pointer}
.tabs{height:68px;background:#eae7dc;border-radius:40px;padding:6px;display:grid;grid-template-columns:1fr 1fr;margin-bottom:57px}
.tabs button{border-radius:36px;background:transparent;color:#89877f;font-weight:700;font-size:15px}
.tabs button.active{background:#191a18;color:#fff;box-shadow:0 7px 17px #191a1820}
.field{margin-bottom:27px}
.field input{height:65px;width:100%;border:1px solid #deddd7;border-radius:24px;padding:0 23px;font-size:16px;outline:none;background:#fff;color:#191a18;box-shadow:0 3px 9px #1a1a1a05}
.field input::placeholder{color:#aaa9a3}.field input:focus{border-color:#c3a64d}
.phone-wrap{display:flex;align-items:center;height:65px;border:1px solid #deddd7;border-radius:24px;padding:0 22px;box-shadow:0 3px 9px #1a1a1a05}
.phone-wrap select{border:0;background:transparent;font-size:16px;outline:none;max-width:85px;color:#191a18}
.phone-wrap input{border:0!important;box-shadow:none!important;height:60px!important;padding-left:13px!important;min-width:0}
.password-wrap{position:relative}.password-wrap input{padding-right:55px}
.eye{position:absolute;right:21px;top:50%;transform:translateY(-50%);background:none;color:#191a18;font-size:19px}
.referral{margin-bottom:25px}
.terms{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:#929087;line-height:1.5;margin:3px 0 25px 48px}
.terms input{width:19px;height:19px;accent-color:#b99b40;flex:0 0 auto;margin-top:1px}
.terms a{color:#b39a49;text-decoration:none}
.gold-btn{height:74px;width:100%;border-radius:23px;background:linear-gradient(100deg,#e3c96f,#b89638);color:#241f11;font-weight:800;font-size:19px;box-shadow:0 7px 16px #ad91382b}
.home-btn{height:66px;width:100%;border-radius:23px;background:#f7f5ed;border:1px solid #e2dfd3;margin-top:17px;color:#444;font-weight:700;font-size:18px}
.note{text-align:center;color:#999;font-size:10px;line-height:1.6;margin-top:17px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#171817;color:white;padding:12px 17px;border-radius:25px;font-size:12px;z-index:50;display:none;max-width:90%;text-align:center}
@media(max-width:390px){.auth-card{margin:0 14px;padding:29px 18px 23px}.brand{padding-top:78px}.tabs{margin-bottom:42px}.terms{margin-left:8px}}
</style>
</head>
<body>
<div class="app">
 <button class="language" type="button">◎ English</button>
 <header class="brand">
  <div class="logo">A</div>
  <h2>AUREVIA INVESTMENT</h2>
  <p>GROW YOUR FUTURE</p>
 </header>

 <section class="auth-card" id="register">
  <h1>Sign Up</h1>
  <p class="sub">Already have an account? <a onclick="showAuth('login')">Log In</a></p>
  <div class="tabs">
   <button type="button" id="emailTab" class="active" onclick="setMode('email')">Email Sign Up</button>
   <button type="button" id="phoneTab" onclick="setMode('phone')">Phone Sign Up</button>
  </div>
  <form id="registerForm">
   <div class="field" id="emailField"><input id="regEmail" type="email" placeholder="Email" autocomplete="email"></div>
   <div class="field hidden" id="phoneField">
    <div class="phone-wrap">
     <select id="dialCode" aria-label="Country code"><option value="+63">🇵🇭 +63</option><option value="+1">🇺🇸 +1</option><option value="+44">🇬🇧 +44</option><option value="+65">🇸🇬 +65</option></select>
     <input id="regPhone" type="tel" placeholder="Phone" autocomplete="tel">
    </div>
   </div>
   <div class="field password-wrap"><input id="regPassword" type="password" placeholder="Password" minlength="8" required><button class="eye" type="button" onclick="togglePassword('regPassword',this)" aria-label="Show password">◎</button></div>
   <div class="field password-wrap"><input id="securityPassword" type="password" placeholder="Security Password" required><button class="eye" type="button" onclick="togglePassword('securityPassword',this)" aria-label="Show security password">◎</button></div>
   <div class="field referral"><input id="regInvite" type="text" value="668899" placeholder="Invitation Code"></div>
   <label class="terms"><input type="checkbox" id="agree" required><span>I agree to the <a href="#" onclick="return false">Terms of Use</a> and <a href="#" onclick="return false">Privacy Policy</a></span></label>
   <button class="gold-btn" id="signupBtn" type="submit">Sign Up</button>
  </form>
  <button class="home-btn" type="button" onclick="showAuth('login')">⌂ &nbsp; Go Home</button>
  <p class="note">AUREVIA account registration. Email or phone confirmation may be required.</p>
 </section>

 <section class="auth-card hidden" id="login">
  <h1>Log In</h1>
  <p class="sub">Don't have an account? <a onclick="showAuth('register')">Sign Up</a></p>
  <form id="loginForm">
   <div class="field"><input id="loginEmail" type="email" placeholder="Email" autocomplete="username" required></div>
   <div class="field password-wrap"><input id="loginPassword" type="password" placeholder="Password" required><button class="eye" type="button" onclick="togglePassword('loginPassword',this)">◎</button></div>
   <button class="gold-btn" type="submit">Log In</button>
  </form>
  <button class="home-btn" type="button" onclick="showAuth('register')">Create Account</button>
 </section>
 <div class="toast" id="toast"></div>
</div>
<script>
const SUPABASE_URL="https://spanzvcucstpcgkebxuc.supabase.co";
const SUPABASE_KEY="sb_publishable_RovQnw326KhwDM-ytox-XA_XccbGGwr";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let signupMode="email";
function notify(msg){const el=document.getElementById("toast");el.textContent=msg;el.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display="none",3500)}
function showAuth(which){document.getElementById("register").classList.toggle("hidden",which!=="register");document.getElementById("login").classList.toggle("hidden",which!=="login");window.scrollTo(0,0)}
function setMode(mode){signupMode=mode;document.getElementById("emailTab").classList.toggle("active",mode==="email");document.getElementById("phoneTab").classList.toggle("active",mode==="phone");document.getElementById("emailField").classList.toggle("hidden",mode!=="email");document.getElementById("phoneField").classList.toggle("hidden",mode!=="phone");document.getElementById("regEmail").required=mode==="email";document.getElementById("regPhone").required=mode==="phone"}
function togglePassword(id,button){const input=document.getElementById(id);input.type=input.type==="password"?"text":"password";button.textContent=input.type==="password"?"◎":"◉"}
document.getElementById("registerForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const password=document.getElementById("regPassword").value;
 const securityPassword=document.getElementById("securityPassword").value;
 if(password.length<8){notify("Password must be at least 8 characters.");return}
 if(securityPassword.length<4){notify("Security Password must be at least 4 characters.");return}
 if(!document.getElementById("agree").checked){notify("Please accept the Terms of Use and Privacy Policy.");return}
 const btn=document.getElementById("signupBtn");btn.disabled=true;btn.textContent="Creating account...";
 let result;
 if(signupMode==="email"){
  const email=document.getElementById("regEmail").value.trim();
  result=await client.auth.signUp({email,password,options:{data:{invitation_code:document.getElementById("regInvite").value.trim()}}});
 }else{
  const phone=document.getElementById("dialCode").value+document.getElementById("regPhone").value.replace(/^0+/,"").replace(/\s+/g,"");
  result=await client.auth.signUp({phone,password,options:{data:{invitation_code:document.getElementById("regInvite").value.trim()}}});
 }
 btn.disabled=false;btn.textContent="Sign Up";
 if(result.error){notify(result.error.message);return}
 if(result.data.session){notify("Account created successfully.")}
 else{notify("Registration submitted. Check your email or phone for confirmation.");showAuth("login")}
});
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.textContent="Logging in...";
 const {data,error}=await client.auth.signInWithPassword({email:document.getElementById("loginEmail").value.trim(),password:document.getElementById("loginPassword").value});
 btn.disabled=false;btn.textContent="Log In";if(error){notify(error.message);return}notify("Welcome back, "+(data.user.email||"member"));
});
client.auth.getSession().then(({data})=>{if(data.session)notify("You are already signed in.")});
</script>
</body>
</html>
